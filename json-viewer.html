<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Viewer</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; color: #2c3e50; margin: 0; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
  h2 { text-align: center; }
  #drop { border: 2px dashed #aaa; border-radius: 8px; padding: 32px; text-align: center; color: #666; cursor: pointer; }
  #drop.over { border-color: #42b983; background: #eefaf3; }
  #error { color: #c62828; }
  #viewer { display: none; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 16px 0 8px; }
  #name { font-weight: bold; margin-right: auto; }
  button { padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button:hover { background: #f0f4f8; }
  button.on { background: #42b983; border-color: #42b983; color: #fff; }
  .count { color: #999; margin-left: 4px; }
  .searchbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
  #q { flex: 1; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  #q:focus { outline: none; border-color: #42b983; }
  #sep { padding: 6px 4px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 13px; }
  #hideKeys { padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  .chk { font-size: 13px; white-space: nowrap; cursor: pointer; }
  #qinfo { color: #666; font-size: 13px; white-space: nowrap; }
  mark { background: #ffe082; color: inherit; border-radius: 2px; padding: 0 1px; }
  #filters summary { cursor: pointer; font-weight: bold; }
  #fbody { max-height: 220px; overflow: auto; margin-top: 6px; }
  #drop.compact { padding: 8px; font-size: 13px; }
  #filters { display: none; border: 1px solid #ddd; border-radius: 6px;
             padding: 8px 12px; margin-bottom: 8px; font-size: 14px; }
  #filters label { cursor: pointer; white-space: nowrap; }
  #filters label.off { color: #aaa; }
  #filters .all { display: block; font-weight: bold; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid #eee; }
  #filters .fline { line-height: 1.7; }
  #filters .fkids { margin-left: 18px; border-left: 1px dotted #ccc; padding-left: 6px; }
  #filters .ftog { display: inline-block; width: 16px; font-size: 10px; color: #888; }
  #filters .ftog.click { cursor: pointer; }
  #mind { display: none; border: 1px solid #ddd; border-radius: 6px; overflow: auto; max-height: 70vh; background: #fafcfb; }
  #mind svg { display: block; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
  #mind .nd { cursor: default; } #mind .nd.cont { cursor: pointer; }
  #mind .nd.cont:hover rect { filter: brightness(1.1); }
  #mind path { fill: none; stroke: #b8c4bf; stroke-width: 1.5; }
  #tree { border: 1px solid #ddd; border-radius: 6px; padding: 12px; overflow: auto;
          font-family: Consolas, Menlo, monospace; font-size: 14px; line-height: 1.6; }
  .row { white-space: pre-wrap; word-break: break-all; }
  .row.click { cursor: pointer; }
  .row.click:hover { background: #f0f4f8; }
  .arrow { display: inline-block; width: 14px; font-size: 10px; color: #888; }
  .children { margin-left: 18px; border-left: 1px dotted #ccc; padding-left: 6px; }
  .key { color: #9c27b0; }
  .punct { color: #555; margin-right: 4px; }
  .summary { color: #999; font-style: italic; }
  .string { color: #2e7d32; } .number { color: #1565c0; } .boolean { color: #e65100; } .null { color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <h2>JSON Viewer</h2>
  <div id="drop">JSON 파일을 여기로 드래그하거나 클릭해서 선택
    <input id="file" type="file" accept=".json" hidden>
  </div>
  <p id="error"></p>
  <div id="viewer">
    <div class="toolbar">
      <span id="name"></span>
      <button id="modeData" class="on">데이터 보기</button>
      <button id="modeCode">코드 보기</button>
      <button id="modeMind">마인드맵</button>
      <button id="expand">모두 펼치기</button>
      <button id="collapse">모두 접기</button>
      <button id="copy" title="Ctrl+C">클립보드 복사</button>
      <button id="save" title="Ctrl+S">TXT 저장</button>
    </div>
    <div class="searchbar">
      <input id="q" type="search" placeholder="🔍 항목 검색 (키 또는 값의 일부만 입력)" autocomplete="off">
      <span id="qinfo"></span>
      <select id="sep" title="일괄 복사 구분 방식">
        <option value="tree">트리 (일치 항목만)</option>
        <option value="treefull">트리 (상위 경로 포함)</option>
        <option value="both">콤마 + 줄바꿈</option>
        <option value="comma">콤마</option>
        <option value="nl">줄바꿈</option>
      </select>
      <label class="chk" title="값이 단순 값인 키(name)는 그 값을 항목 이름으로 쓰고, 목록인 키(children)는 줄을 없애고 내용을 바로 아래에 표시. 비우면 사용 안 함">숨길 키 <input id="hideKeys" value="name, children" size="14"></label>
      <label class="chk" title="복사·저장되는 트리에서 배열의 [0], [1] 같은 번호 행을 없애고 내용을 바로 아래에 표시"><input type="checkbox" id="noIdx" checked> [번호] 행 제거</label>
      <button id="copyMatches" disabled title="검색에 일치한 항목의 값만 한 줄씩 복사">결과 일괄 복사</button>
    </div>
    <details id="filters"><summary>항목 선택 (체크박스로 보고 싶은 항목만)</summary><div id="fbody"></div></details>
    <div id="tree"></div>
    <div id="mind"></div>
  </div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var data, fileName = '', nodes = [], mode = 'data', selected = {}, mm = null, query = '', shown = null, total = 0, openAll = true; // mode: 'data' = 값만, 'code' = JSON 문법 표시, 'mind' = 마인드맵

  // Windows 메모장 등은 LF만 있으면 한 줄로 붙여넣으므로 Windows에서는 CRLF 사용
  var EOL = /Win/i.test(navigator.platform || navigator.userAgent) ? '\r\n' : '\n';
  var isObj = function (v) { return v !== null && typeof v === 'object'; };
  var leafText = function (v) { return (typeof v === 'string' && mode === 'code') ? JSON.stringify(v) : String(v); };
  var keysOf = function (v) { return Array.isArray(v) ? v.map(function (_, i) { return i; }) : Object.keys(v); };
  // 항목 선택 상태: selected[경로키] === false 이면 숨김 (경로 = 루트부터의 키 배열)
  var SEP = '\u0001';
  var pk = function (path) { return path.join(SEP); };
  var visibleKeys = function (v, path) {
    return keysOf(v).filter(function (k) {
      var key = pk(path.concat([k]));
      return selected[key] !== false && (!shown || shown[key]);
    });
  };

  // ---- 검색 ----
  // 키(객체 키만) 또는 값에 검색어가 포함된 항목 + 그 상위 경로 + (키가 일치한 경우) 하위 전체를 표시
  var isIndexLabel = function (l) { return typeof l === 'number' || /^\[\d+\]$/.test(l); };
  var hasQ = function (t) { return String(t).toLowerCase().indexOf(query) !== -1; };
  function computeSearch() {
    shown = null;
    $('qinfo').textContent = '';
    $('copyMatches').disabled = !query;
    if (!query || !isObj(data)) return;
    shown = {};
    var hits = 0;
    (function walk(v, path, forced) {
      var arr = Array.isArray(v), any = false;
      keysOf(v).forEach(function (k) {
        var p = path.concat([k]), c = v[k], container = isObj(c);
        var keyHit = !arr && hasQ(k), valHit = !container && hasQ(c);
        var self = keyHit || valHit;
        if (self) hits++;
        var below = container ? walk(c, p, forced || keyHit) : false;
        if (forced || self || below) { shown[pk(p)] = true; any = true; }
      });
      return any;
    })(data, [], false);
    $('qinfo').textContent = hits ? hits + '개 일치' : '일치 항목 없음';
    $('copyMatches').disabled = !hits;
  }
  // 일치 부분을 <mark>로 강조
  function setText(elm, text, plain) {
    text = String(text);
    if (!query || plain) { elm.textContent = text; return; }
    var low = text.toLowerCase(), i = 0, idx;
    elm.textContent = '';
    while ((idx = low.indexOf(query, i)) !== -1) {
      if (idx > i) elm.appendChild(document.createTextNode(text.slice(i, idx)));
      elm.appendChild(el('mark', null, text.slice(idx, idx + query.length)));
      i = idx + query.length;
    }
    elm.appendChild(document.createTextNode(text.slice(i)));
  }
  var summary = function (v, path) {
    var n = visibleKeys(v, path).length;
    if (mode !== 'code') return '(' + n + ')';
    return Array.isArray(v) ? (n ? '[' + n + ']' : '[]') : '{}';
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---- 트리 렌더링 ----
  function buildNode(label, value, depth, path) {
    var node = el('div');
    var row = el('div', 'row');
    var arrow = el('span', 'arrow');
    row.appendChild(arrow);
    if (label !== null) {
      var ks = el('span', 'key');
      setText(ks, label, isIndexLabel(label));
      row.appendChild(ks);
      row.appendChild(el('span', 'punct', ':'));
    }
    if (!isObj(value)) {
      var t = value === null ? 'null' : typeof value;
      var vs = el(t === 'object' ? 'span' : 'span', t);
      setText(vs, leafText(value));
      row.appendChild(vs);
      node.appendChild(row);
      return node;
    }
    var arr = Array.isArray(value), keys = visibleKeys(value, path);
    row.classList.add('click');
    if (mode === 'data') return buildDataContainer(node, row, arrow, arr, keys, value, depth, path);
    row.appendChild(el('span', 'punct', arr ? '[' : '{'));
    var sum = el('span', 'summary', keys.length + (arr ? ' items ]' : ' keys }'));
    row.appendChild(sum);
    var kids = el('div', 'children');
    keys.forEach(function (k) { kids.appendChild(buildNode(k, value[k], depth + 1, path.concat([k]))); });
    var end = el('div', 'row');
    end.appendChild(el('span', 'arrow'));
    end.appendChild(el('span', 'punct', arr ? ']' : '}'));
    kids.appendChild(end);
    node.appendChild(row);
    node.appendChild(kids);
    var api = {
      set: function (open) {
        kids.style.display = open ? '' : 'none';
        sum.style.display = open ? 'none' : '';
        arrow.textContent = open ? '▼' : '▶';
        api.open = open;
      }
    };
    row.addEventListener('click', function () { api.set(!api.open); });
    api.set(query || openAll ? true : depth < 2);
    nodes.push(api);
    return node;
  }

  // 데이터 보기: 괄호/따옴표/닫는 줄 없이 키와 값만 표시
  function buildDataContainer(node, row, arrow, arr, keys, value, depth, path) {
    row.appendChild(el('span', 'count', '(' + keys.length + ')'));
    var kids = el('div', 'children');
    keys.forEach(function (k) { kids.appendChild(buildNode(arr ? '[' + k + ']' : k, value[k], depth + 1, path.concat([k]))); });
    node.appendChild(row);
    node.appendChild(kids);
    var api = { set: function (open) {
      kids.style.display = open ? '' : 'none';
      arrow.textContent = open ? '▼' : '▶';
      api.open = open;
    } };
    row.addEventListener('click', function () { api.set(!api.open); });
    api.set(query || openAll ? true : depth < 2);
    nodes.push(api);
    return node;
  }

  function render() {
    nodes = [];
    var tree = $('tree'), isMind = mode === 'mind';
    tree.textContent = '';
    tree.style.display = isMind ? 'none' : '';
    $('mind').style.display = isMind ? 'block' : 'none';
    if (isMind) mm = mmBuild(isObj(data) ? fileName : null, data, 0, []), drawMind();
    else tree.appendChild(buildNode(mode === 'data' && isObj(data) ? fileName : null, data, 0, []));
    $('name').textContent = fileName;
    $('viewer').style.display = 'block';
  }

  // ---- 항목 체크박스 (모든 하위 단계, 펼칠 때 생성) ----
  var fstate = [], allBox = null;

  function refreshFilters() {
    var off = Object.keys(selected).filter(function (k) { return selected[k] === false; });
    fstate.forEach(function (f) {
      var key = pk(f.path);
      f.cb.checked = selected[key] !== false;
      // 체크된 항목의 하위 중 해제된 것이 있으면 부분 선택 표시
      f.cb.indeterminate = f.cb.checked && off.some(function (o) { return o.indexOf(key + SEP) === 0; });
      var hidden = false;
      for (var i = 1; i < f.path.length; i++) if (selected[pk(f.path.slice(0, i))] === false) { hidden = true; break; }
      f.lab.className = hidden ? 'off' : '';
    });
    var topAllOff = keysOf(data).every(function (k) { return selected[pk([k])] === false; });
    allBox.checked = off.length === 0;
    allBox.indeterminate = off.length > 0 && !topAllOff;
  }

  function buildFilterLevel(container, value, path) {
    var arr = Array.isArray(value);
    keysOf(value).forEach(function (k) {
      var p = path.concat([k]), v = value[k], row = el('div', 'frow'), line = el('div', 'fline');
      var hasKids = isObj(v) && keysOf(v).length > 0;
      var tog = el('span', 'ftog' + (hasKids ? ' click' : ''), hasKids ? '▶' : '');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      var lab = el('label');
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(' ' + (arr ? '[' + k + ']' : k) + (isObj(v) ? ' (' + keysOf(v).length + ')' : '')));
      line.appendChild(tog);
      line.appendChild(lab);
      row.appendChild(line);
      cb.addEventListener('change', function () {
        selected[pk(p)] = cb.checked;
        refreshFilters();
        render();
      });
      fstate.push({ cb: cb, path: p, lab: lab });
      if (hasKids) {
        var kids = null;
        tog.addEventListener('click', function () {
          if (!kids) {
            kids = el('div', 'fkids');
            buildFilterLevel(kids, v, p);
            row.appendChild(kids);
            tog.textContent = '▼';
            refreshFilters();
          } else {
            var hide = kids.style.display !== 'none';
            kids.style.display = hide ? 'none' : '';
            tog.textContent = hide ? '▶' : '▼';
          }
        });
      }
      container.appendChild(row);
    });
  }

  function renderFilters() {
    var box = $('fbody'), wrap = $('filters');
    box.textContent = '';
    fstate = [];
    var has = isObj(data) && keysOf(data).length > 0;
    wrap.style.display = has ? 'block' : 'none';
    if (!has) return;
    allBox = document.createElement('input');
    allBox.type = 'checkbox';
    var allLab = el('label', 'all');
    allLab.appendChild(allBox);
    allLab.appendChild(document.createTextNode(' 전체 (▶ 를 눌러 세부 항목 선택)'));
    box.appendChild(allLab);
    allBox.addEventListener('change', function () {
      selected = {};
      if (!allBox.checked) keysOf(data).forEach(function (k) { selected[pk([k])] = false; });
      refreshFilters();
      render();
    });
    var list = el('div', 'ftree');
    box.appendChild(list);
    buildFilterLevel(list, data, []);
    refreshFilters();
  }

  // ---- 마인드맵 (SVG) ----
  var palette = ['#42b983', '#1565c0', '#9c27b0', '#e65100', '#00838f', '#6d4c41'];
  var mctx = document.createElement('canvas').getContext('2d');
  mctx.font = '13px "Segoe UI", sans-serif';

  function mmBuild(label, value, depth, path) {
    var n = { label: label, value: value, depth: depth, kids: [], container: isObj(value), open: !!query || depth < 3 || total <= 200 };
    n.hit = !!query && ((label !== null && !isIndexLabel(label) && hasQ(label)) || (!n.container && hasQ(value)));
    if (n.container) {
      var arr = Array.isArray(value);
      visibleKeys(value, path).forEach(function (k) {
        n.kids.push(mmBuild(arr ? '[' + k + ']' : k, value[k], depth + 1, path.concat([k])));
      });
    }
    return n;
  }

  function mmText(n) {
    var t;
    if (n.container) t = (n.label === null ? '' : n.label + ' ') + '(' + n.kids.length + ')';
    else t = (n.label === null ? '' : n.label + ': ') + leafText(n.value);
    t = t.replace(/\s+/g, ' ');
    return t.length > 50 ? t.slice(0, 49) + '…' : t;
  }

  function svgEl(tag, attrs) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function drawMind() {
    var rowH = 32, padX = 12, gap = 56, cursor = 24, widths = [], xs = [], x = 20;
    (function measure(n) {
      n.text = (n.container ? (n.open ? '▾ ' : '▸ ') : '') + mmText(n);
      n.w = Math.ceil(mctx.measureText(n.text).width) + padX * 2;
      widths[n.depth] = Math.max(widths[n.depth] || 0, n.w);
      if (n.container && n.open) n.kids.forEach(measure);
    })(mm);
    widths.forEach(function (w, i) { xs[i] = x; x += w + gap; });
    (function lay(n) {
      n.x = xs[n.depth];
      if (n.container && n.open && n.kids.length) {
        n.kids.forEach(lay);
        n.y = (n.kids[0].y + n.kids[n.kids.length - 1].y) / 2;
      } else { n.y = cursor; cursor += rowH; }
    })(mm);
    var W = x - gap + 20, H = cursor + 8;
    var svg = svgEl('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H });
    var edges = svgEl('g', {}), boxes = svgEl('g', {});
    svg.appendChild(edges); svg.appendChild(boxes);
    (function paint(n) {
      var color = palette[n.depth % palette.length];
      var g = svgEl('g', { 'class': 'nd' + (n.container ? ' cont' : '') });
      var title = svgEl('title', {});
      title.textContent = (n.label === null ? '' : n.label + (n.container ? '' : ': ')) + (n.container ? '' : String(n.value));
      g.appendChild(title);
      g.appendChild(svgEl('rect', {
        x: n.x, y: n.y - 13, width: n.w, height: 26, rx: 13,
        fill: n.container ? color : '#fff', stroke: n.hit ? '#ff9800' : color, 'stroke-width': n.hit ? 3.5 : 1.5
      }));
      var t = svgEl('text', { x: n.x + padX, y: n.y + 4.5, fill: n.container ? '#fff' : '#2c3e50' });
      t.textContent = n.text;
      g.appendChild(t);
      if (n.container) g.addEventListener('click', function () { n.open = !n.open; drawMind(); });
      boxes.appendChild(g);
      if (n.container && n.open) n.kids.forEach(function (c) {
        var x1 = n.x + n.w, x2 = c.x, mx = (x1 + x2) / 2;
        edges.appendChild(svgEl('path', { d: 'M' + x1 + ' ' + n.y + ' C' + mx + ' ' + n.y + ',' + mx + ' ' + c.y + ',' + x2 + ' ' + c.y }));
        paint(c);
      });
    })(mm);
    var box = $('mind');
    var sx = box.scrollLeft, sy = box.scrollTop;
    box.textContent = '';
    box.appendChild(svg);
    box.scrollLeft = sx; box.scrollTop = sy;
  }

  function mmSetAll(open) {
    (function walk(n) { if (n.container) { n.open = n.depth === 0 || open; n.kids.forEach(walk); } })(mm);
    drawMind();
  }

  // ---- 트리 텍스트 (├── └──) ----
  // ---- 복사/저장용 트리 만들기 ----
  // "숨길 키"(예: name, children):
  //   - 값이 단순 값인 키(name) → 줄은 없애고 그 값을 항목 이름으로 사용
  //   - 값이 목록/객체인 키(children) → 키 줄은 없애고 내용을 바로 아래 단계로 표시
  function hiddenKeys() {
    return $('hideKeys').value.split(',').map(function (t) { return t.trim().toLowerCase(); }).filter(Boolean);
  }
  function isHidden(k, H) { return typeof k === 'string' && H.indexOf(k.toLowerCase()) !== -1; }
  function labelOf(o, H) {
    if (!isObj(o) || Array.isArray(o) || !H.length) return null;
    var parts = [];
    Object.keys(o).forEach(function (k) { if (isHidden(k, H) && !isObj(o[k])) parts.push(String(o[k])); });
    return parts.length ? parts.join(' ') : null;
  }

  // 라벨(name)이 없는 배열 요소 객체의 "머리글" 키: 숨김이 아닌 첫 번째 단순 값 키
  function headerKey(o, path, H) {
    var ks = visibleKeys(o, path);
    for (var i = 0; i < ks.length; i++) if (!isObj(o[ks[i]]) && !isHidden(ks[i], H)) return ks[i];
    return null;
  }

  // node의 자식 항목 목록: {text, sub(하위 node 또는 null), path, skip(sub에서 머리글로 쓴 키), cnt(개수 표시 대상)}
  // 배열 요소(객체)는 [번호] 줄 없이 하나의 항목이 되고, 나머지 필드와 children 내용은 그 아래 단계로 들어가 부모-자식 관계를 유지
  function entriesOf(node, path, skip) {
    var H = hiddenKeys(), arr = Array.isArray(node), noIdx = $('noIdx').checked, out = [];
    visibleKeys(node, path).forEach(function (k) {
      if (skip !== undefined && String(k) === String(skip)) return;
      var v = node[k], p = path.concat([k]), con = isObj(v), lb = labelOf(v, H);
      if (arr) {
        if (noIdx) {
          if (!con) out.push({ text: leafText(v), sub: null, path: p });
          else if (lb !== null) out.push({ text: lb, sub: v, path: p });
          else {
            var hk = Array.isArray(v) ? null : headerKey(v, p, H);
            if (hk !== null) out.push({ text: hk + ': ' + leafText(v[hk]), sub: v, path: p, skip: hk });
            else out = out.concat(entriesOf(v, p));
          }
        } else {
          out.push({ text: '[' + k + ']' + (con ? (lb !== null ? ' ' + lb : '') : ': ' + leafText(v)), sub: con ? v : null, path: p, cnt: con && lb === null });
        }
      } else if (isHidden(k, H)) {
        if (con) out = out.concat(entriesOf(v, p));      // 값이 단순 값이면 이름으로 쓰이므로 줄 생략
      } else {
        out.push({ text: k + (con ? (lb !== null ? ': ' + lb : '') : ': ' + leafText(v)), sub: con ? v : null, path: p, cnt: con && lb === null });
      }
    });
    return out;
  }

  // node 하위를 ├── └── 로 lines에 추가
  function walkTree(node, prefix, path, lines, noCount, skip) {
    var entries = entriesOf(node, path, skip);
    entries.forEach(function (e, i) {
      var last = i === entries.length - 1;
      lines.push(prefix + (last ? '└── ' : '├── ') + e.text + (e.cnt && !noCount ? ' ' + summary(e.sub, e.path) : ''));
      if (e.sub) walkTree(e.sub, prefix + (last ? '    ' : '│   '), e.path, lines, noCount, e.skip);
    });
  }

  function toTree(root, noCount) {
    var lb = labelOf(root, hiddenKeys());
    var lines = [isObj(root) ? (lb !== null ? lb : (fileName || 'root') + (noCount ? '' : ' ' + summary(root, []))) : leafText(root)];
    if (isObj(root)) walkTree(root, '', [], lines, noCount);
    return lines.join(EOL);
  }

  // 검색 일치 항목만 트리로. 일치하지 않는 중간 단계는 건너뛰되,
  // 일치 항목 사이의 부모-자식(상하) 관계는 원래 JSON 구조 그대로 들여쓰기로 유지
  function toMatchTree() {
    var H = hiddenKeys(), lines = [];
    function forest(v, path) {
      var arr = Array.isArray(v), own = [], below = [];
      visibleKeys(v, path).forEach(function (k) {
        var c = v[k], p = path.concat([k]);
        if (!arr && hasQ(k)) {                       // 키 일치: 해당 항목 + 하위 내용 전체
          if (isHidden(k, H)) {
            if (isObj(c)) entriesOf(c, p).forEach(function (e) { own.push({ text: e.text, sub: e.sub, path: e.path, skip: e.skip, kids: [] }); });
            else own.push({ text: leafText(c), kids: [] });
          } else if (isObj(c)) own.push({ text: k, sub: c, path: p, kids: [] });
          else own.push({ text: k + ': ' + leafText(c), kids: [] });
        } else if (isObj(c)) {
          below = below.concat(forest(c, p));
        } else if (hasQ(c)) {                        // 값 일치
          own.push({ text: arr || isHidden(k, H) ? leafText(c) : k + ': ' + leafText(c), kids: [] });
        }
      });
      if (!own.length) return below;
      // 같은 객체 안의 일치 항목은 형제, 그 아래 단계의 일치 항목은 첫 일치 항목의 자식
      var host = own.filter(function (n) { return !n.sub; })[0];
      if (host) { host.kids = host.kids.concat(below); return own; }
      return own.concat(below);
    }
    function render(nodes, prefix, top) {
      nodes.forEach(function (n, i) {
        var last = i === nodes.length - 1;
        lines.push(top ? n.text : prefix + (last ? '└── ' : '├── ') + n.text);
        var cp = top ? '' : prefix + (last ? '    ' : '│   ');
        if (n.sub) walkTree(n.sub, cp, n.path, lines, true, n.skip);
        if (n.kids.length) render(n.kids, cp, false);
      });
    }
    render(forest(data, []), '', true);
    return lines.join(EOL);
  }

  // ---- 파일 로드 ----
  function load(file) {
    if (!file) return;
    if (!/\.json$/i.test(file.name)) {
      $('error').textContent = '⚠ JSON 파일(.json)만 열 수 있습니다. 선택한 파일: ' + file.name;
      return;
    }
    var r = new FileReader();
    r.onload = function () {
      try {
        data = JSON.parse(String(r.result).replace(/^﻿/, ''));
        fileName = file.name;
        selected = {};
        total = 0;
        (function count(v) { if (isObj(v)) keysOf(v).forEach(function (k) { total++; count(v[k]); }); })(data);
        openAll = total <= 3000; // 너무 큰 JSON만 2단계까지 펼침
        computeSearch();
        $('error').textContent = '';
        renderFilters();
        $('drop').classList.add('compact');
        render();
        $('q').focus();
      } catch (e) {
        $('error').textContent = '⚠ JSON 파싱 실패: ' + e.message;
        $('viewer').style.display = 'none';
      }
    };
    r.onerror = function () { $('error').textContent = '⚠ 파일을 읽을 수 없습니다.'; };
    r.readAsText(file);
  }

  var drop = $('drop');
  drop.addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function (e) { load(e.target.files[0]); e.target.value = ''; });
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
  drop.addEventListener('drop', function (e) {
    e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]);
  });
  // 페이지 어디에 놓아도 브라우저가 파일을 열지 않도록
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); if (e.target !== drop && !drop.contains(e.target)) load(e.dataTransfer.files[0]); });

  try { var hk = localStorage.getItem('jv-hide'); if (hk !== null) $('hideKeys').value = hk; } catch (e) {}
  $('hideKeys').addEventListener('input', function () { try { localStorage.setItem('jv-hide', this.value); } catch (e) {} });

  var qTimer;
  $('q').addEventListener('input', function () {
    var v = this.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      query = v.trim().toLowerCase();
      if (data === undefined) return;
      computeSearch();
      render();
    }, 150);
  });
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { this.value = ''; this.dispatchEvent(new Event('input')); }
  });

  function setMode(m) {
    mode = m;
    $('modeData').classList.toggle('on', m === 'data');
    $('modeCode').classList.toggle('on', m === 'code');
    $('modeMind').classList.toggle('on', m === 'mind');
    if (data !== undefined) render();
  }
  $('modeData').addEventListener('click', function () { setMode('data'); });
  $('modeCode').addEventListener('click', function () { setMode('code'); });
  $('modeMind').addEventListener('click', function () { setMode('mind'); });

  $('expand').addEventListener('click', function () { if (mode === 'mind') mmSetAll(true); else nodes.forEach(function (n) { n.set(true); }); });
  $('collapse').addEventListener('click', function () { if (mode === 'mind') mmSetAll(false); else nodes.forEach(function (n) { n.set(false); }); });

  function doCopy() {
    if (data === undefined) return;
    copyText(toTree(data), $('copy'));
  }

  // 검색 일치 항목 일괄 복사 (트리 형태 / 값만 구분자로)
  function doCopyMatches() {
    if (data === undefined || !query) return;
    var lines = [];
    var sv = $('sep').value;
    if (sv === 'tree' || sv === 'treefull') {
      var tt = sv === 'tree' ? toMatchTree() : toTree(data, true);
      $('error').textContent = '';
      copyText(tt, $('copyMatches'), '트리 복사됨 ✓');
      return;
    }
    (function walk(v, path, forced) {
      var arr = Array.isArray(v);
      visibleKeys(v, path).forEach(function (k) {
        var c = v[k], p = path.concat([k]);
        var keyHit = !arr && hasQ(k), f = forced || keyHit;
        if (isObj(c)) {
          walk(c, p, f);
        } else if (f || hasQ(c)) lines.push(String(c));
      });
    })(data, [], false);
    if (!lines.length) { $('error').textContent = '⚠ 복사할 검색 결과가 없습니다.'; return; }
    $('error').textContent = '';
    copyText(joinMatches(lines), $('copyMatches'), lines.length + '줄 복사됨 ✓');
  }

  // 구분 방식: 콤마 + 줄바꿈("a,⏎b") / 콤마("a, b") / 줄바꿈
  function joinMatches(lines) {
    var m = $('sep').value;
    if (m === 'comma') return lines.join(', ');
    if (m === 'nl') return lines.join(EOL);
    return lines.join(',' + EOL);
  }
  try { var savedSep = localStorage.getItem('jv-sep'); if (savedSep) $('sep').value = savedSep; } catch (e) {}
  $('sep').addEventListener('change', function () { try { localStorage.setItem('jv-sep', this.value); } catch (e) {} });

  function copyText(text, btn, doneMsg) {
    var orig = btn.getAttribute('data-label') || btn.textContent;
    btn.setAttribute('data-label', orig);
    function done() { btn.textContent = doneMsg || '복사됨 ✓'; setTimeout(function () { btn.textContent = orig; }, 1500); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { $('error').textContent = '⚠ 복사 실패'; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  $('copy').addEventListener('click', doCopy);
  $('copyMatches').addEventListener('click', doCopyMatches);

  function doSave() {
    if (data === undefined) return;
    var blob = new Blob([toTree(data)], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (fileName.replace(/\.json$/i, '') || 'output') + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  }
  $('save').addEventListener('click', doSave);

  // 단축키: Ctrl/Cmd+C = 현재 화면 복사(텍스트를 선택한 경우는 기본 복사), Ctrl/Cmd+S = TXT 저장
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey || data === undefined) return;
    var k = e.key.toLowerCase();
    if (k === 'c') {
      var ae = document.activeElement;
      var inField = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
      var hasSel = inField ? ae.selectionStart !== ae.selectionEnd : !!String(window.getSelection());
      if (hasSel) return;
      e.preventDefault();
      doCopy();
    } else if (k === 's') {
      e.preventDefault();
      doSave();
    }
  });
})();
</script>
</body>
</html>
